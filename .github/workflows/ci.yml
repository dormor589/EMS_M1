# ---------------------------------------------------------------------------
# CI — runs on every push and pull request.
#
# The server job starts a real PostgreSQL service rather than mocking the
# driver, because the schema's CHECK and UNIQUE constraints are part of what
# the integration tests verify. A mocked database would happily accept a
# duplicate submission and the tests would pass while the behaviour was broken.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main, dev, 'milestone-*']
  pull_request:
    branches: [main, dev]

jobs:
  server:
    name: Server — tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: exam_app_test
        ports:
          - 5432:5432
        # Without this the job races Postgres and the first query fails.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/exam_app_test
      JWT_SECRET: ci-only-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: npm ci

      - name: Build the schema
        working-directory: server
        run: node src/db/migrate.js
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Test
        working-directory: server
        run: npm test

  client:
    name: Client — lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Test
        working-directory: client
        run: npm test

      - name: Build
        working-directory: client
        run: npm run build

  docker:
    name: Docker — images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches a broken Dockerfile before anyone tries to run the stack.
      - name: Build the API image
        run: docker build -t ems-api ./server

      - name: Build the client image
        run: docker build -t ems-client ./client
