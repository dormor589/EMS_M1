server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: the router owns the URL space, so any path that is not
    # a real file must return index.html rather than 404. Without this, a
    # refresh on /teacher/exams would break.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames change whenever content changes, so they can be
    # cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
